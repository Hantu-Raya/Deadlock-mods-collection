<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Observer HUD · 3 · Pulp Broadsheet</title>
<link rel="stylesheet" href="assets/generated.css">
<link rel="stylesheet" href="shared/base.css">
<style>
/* Pulp Broadsheet: a 1920s evening paper pasted across the top. Stock paper texture,
   Valve Pulp headlines, ink rules, duotone player photos. In game the duotone is
   saturation 0 plus wash-color; the torn edge is one opacity-mask texture. */
:root {
  --torn: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1920 134' preserveAspectRatio='none'><path d='M0 0H1920V118L1906 122 1890 116 1868 124 1851 117 1830 125 1802 119 1780 126 1757 118 1733 123 1712 117 1690 126 1664 120 1640 127 1618 119 1596 124 1570 117 1548 125 1524 120 1500 128 1478 118 1455 124 1430 116 1407 125 1385 119 1360 127 1338 120 1312 126 1290 117 1266 123 1240 118 1218 127 1194 121 1170 128 1148 119 1124 125 1100 117 1076 126 1052 120 1028 128 1004 121 980 127 956 118 932 124 908 117 884 126 860 120 836 128 812 119 788 125 764 117 740 126 716 120 692 127 668 118 644 124 620 117 596 126 572 119 548 127 524 120 500 125 476 117 452 126 428 119 404 128 380 120 356 125 332 117 308 126 284 119 260 127 236 120 212 125 188 117 164 126 140 119 116 127 92 120 68 125 44 117 20 124 0 119Z'/></svg>");
}
.sheet {
  position: absolute; left: 0; top: 0; width: 1920px; height: 134px;
  background:
    linear-gradient(to bottom, rgba(120, 92, 52, 0.08), rgba(120, 92, 52, 0.22)),
    var(--paper) url("assets/game/hud__top_bar__chat_texture_png.png") 0 0 / 229px 201px;
  -webkit-mask: var(--torn) 0 0 / 100% 100% no-repeat; mask: var(--torn) 0 0 / 100% 100% no-repeat;
  color: var(--ink);
}
.rule2 { position: absolute; left: 36px; right: 36px; top: 8px; height: 4px; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); }
.mast { position: absolute; left: 50%; top: 18px; width: 340px; transform: translateX(-50%); text-align: center; }
.mast .kicker { font: 700 11px/1 "Retail Demo"; letter-spacing: 0.26em; text-transform: uppercase; }
.mast .title { margin-top: 5px; font: 700 23px/1 "Valve Pulp"; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; }
.mast .dateline { margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--ink); font: 600 12px/1 "Reaver"; letter-spacing: 0.1em; text-transform: uppercase; display: flex; justify-content: center; gap: 12px; }
.clockbox { position: absolute; left: 50%; top: 104px; transform: translateX(-50%); padding: 5px 14px 6px; background: var(--ink); color: var(--paper); font: 600 28px/1 "VALVE Oracle"; letter-spacing: 0.04em; }

.head { position: absolute; top: 22px; display: flex; align-items: center; gap: 12px; }
.head.left { right: calc(50% + 186px); }
.head.right { left: calc(50% + 186px); flex-direction: row-reverse; }
.head .score { width: 50px; height: 58px; display: flex; align-items: center; justify-content: center; font: 700 44px/1 "Valve Pulp"; color: var(--paper); }
.amber .score { background: #8a5a17; }
.sapphire .score { background: #2c3b78; }
.head .names { text-align: right; }
.right .names { text-align: left; }
.head .tname { font: 700 30px/1 "Valve Pulp"; text-transform: uppercase; white-space: nowrap; }
.head .sub { margin-top: 4px; font: 700 11px/1 "Retail Demo"; letter-spacing: 0.16em; text-transform: uppercase; white-space: nowrap; }
.stamp { display: inline-block; margin-top: 6px; padding: 2px 6px; border: 2px solid; font: 700 11px/1 "Retail Demo"; letter-spacing: 0.18em; text-transform: uppercase; transform: rotate(-3deg); }
.amber .stamp { color: #8a5a17; }
.sapphire .stamp { color: #2c3b78; transform: rotate(3deg); }

.photos { position: absolute; top: 12px; display: flex; gap: 8px; }
.photos.left { left: 40px; }
.photos.right { right: 40px; }
.ph { width: 64px; }
.ph:nth-child(odd) { transform: rotate(-1.5deg); }
.ph:nth-child(even) { transform: rotate(1.2deg); }
.frame { position: relative; width: 64px; height: 64px; overflow: hidden; border: 2px solid var(--ink); background: #b9b2a5; }
.frame img { position: absolute; left: -5px; top: -4px; width: 72px; filter: grayscale(1) contrast(1.15); }
.frame .tint { position: absolute; inset: 0; opacity: 0.32; }
.amber .tint { background: #b8781e; }
.sapphire .tint { background: #3550b4; }
.ph.dead .frame img { filter: grayscale(1) brightness(0.55); }
.ko { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-12deg); padding: 2px 5px; border: 2px solid #a3201a; color: #a3201a; background: rgba(220, 217, 210, 0.85); font: 700 15px/1 "Valve Pulp"; white-space: nowrap; }
.cap { margin-top: 4px; font: 700 11px/1 "Retail Demo"; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.04em; }
.u { position: absolute; right: 0; top: 0; padding: 2px 3px; background: var(--paper); color: var(--ink); border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); font: 600 10px/1 "VALVE Oracle"; }
.u.ready { background: var(--ink); color: var(--paper); font: 700 9px/1 "Retail Demo"; letter-spacing: 0.08em; }
.inkbar { margin-top: 3px; height: 5px; border: 1px solid var(--ink); }
.inkbar b { display: block; height: 3px; background: var(--ink); }
.inkbar b.low { background: #a3201a; }
</style>
</head>
<body>
<div class="stage">
  <div class="sheet" id="sheet"></div>
  <div class="design-tag"><b>3 · Pulp Broadsheet</b> — evening paper across the top</div>
</div>
<script src="shared/data.js"></script>
<script>
OH.mount((oh) => {
  const photo = (p) => `
    <div class="ph ${p.dead ? "dead" : ""}">
      <div class="frame"><img src="${p.portrait}" alt=""><div class="tint"></div>${p.dead ? `<div class="ko">KO ${p.dead}</div>` : ""}<span class="u ${p.ult === "ready" ? "ready" : ""}">${p.ult === "ready" ? "ULT" : p.ult}</span></div>
      <div class="inkbar"><b class="${p.hp > 0 && p.hp < 0.3 ? "low" : ""}" style="width:${Math.round(p.hp * 100)}%"></b></div>
      <div class="cap">${p.name}</div>
    </div>`;
  const head = (key) => {
    const t = oh.teams[key];
    return `<div class="head ${t.side} ${key}">
      <div class="names"><div class="tname">${t.name}</div>
        <div class="sub">${t.kills} kills · ${oh.souls(t.souls)} souls</div>
        <span class="stamp">${t.patron}</span></div>
      <div class="score">${t.series}</div>
    </div>`;
  };
  const lead = oh.lead();
  const a = oh.teams.amber, s = oh.teams.sapphire;
  document.getElementById("sheet").innerHTML = `
    <div class="rule2"></div>
    <div class="photos left amber">${a.players.map(photo).join("")}</div>
    ${head("amber")}
    <div class="mast">
      <div class="kicker">Extra · ${oh.match.stage}</div>
      <div class="title">${oh.match.event}</div>
      <div class="dateline"><span>Game ${oh.match.game} of ${oh.match.bestOf}</span><span>·</span><span>${oh.teams[lead.team].tag} leads by ${oh.souls(lead.value)}</span></div>
    </div>
    ${head("sapphire")}
    <div class="photos right sapphire">${s.players.map(photo).join("")}</div>`;
  document.getElementById("sheet").insertAdjacentHTML("afterend", `<div class="clockbox">${oh.match.clock}</div>`);
});
</script>
</body>
</html>
